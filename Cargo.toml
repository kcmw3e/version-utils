[workspace.package]
description = "Version bumping utilities (also has a command line)."
version = "0.1.0"
authors = ["Casey Walker"]
readme = "readme"
license = "MIT"
repository = "https://github.com/kcmw3e/vup"
edition = "2024"

[workspace]
resolver = "3"
members = ["vup", "vup-cli", "vpop"]

[workspace.dependencies]
clap = { version = "4.5.50", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
thiserror = "2.0.17"

vup = { path = "./vup", version = "0.1.0" }
vpop = { path = "./vpop", version = "0.1.0" }
